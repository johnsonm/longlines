openapi: 3.1.0
# The management API's reference. The route table in
# supabase/functions/_shared/api/routes.ts and this file change together:
# supabase/functions/_shared/__tests__/openapi.test.ts compares their methods,
# paths, scopes, statuses and body fields.
info:
  title: Long Lines API
  version: "1"
  description: |
    Manage your connections, destinations, callsign groups and goals from your own
    scripts, bots and club tools. Everything the web app can change about these, the API can change too, and the
    same rules and error messages apply.

    ## Tokens

    Create a token on the **API tokens** page. Long Lines shows it once; copy it then. A token
    looks like `ll_live_7hq2…` followed by more letters and digits.

    - **Access.** *Read only* tokens can only make `GET` requests. *Read and write* tokens can
      do everything below.
    - **Expiry.** A token can expire after 30, 90 or 365 days, or never.
    - **Rotate** gives a token a new secret, keeping its name, access and expiry. The old
      secret stops working immediately. The expiry window restarts from the rotation.
    - **Revoke** deletes the token. It stops working immediately.
    - You can have up to 10 tokens.

    Send the token in the `Authorization` header on every request:

    ```sh
    curl https://api.longlines.io/v1/connections \
      -H "Authorization: Bearer ll_live_…"
    ```

    A token acts as you. Anyone who has it can change your connections and destinations, so
    keep it out of source control. If one leaks, rotate or revoke it.

    ## Limits

    - **Rate limit.** 60 requests per minute per token. Over the limit you get `429` with a
      `Retry-After` header giving the seconds until the next minute.
    - **Request size.** A request body can be at most 256 KB.
    - **List size.** A list in a request, such as `callsigns`, can hold at most 2,000 items,
      and a group at most 1,000 callsigns.
    - **Account size.** An account can have up to 100 connections, 50 destinations, 50
      callsign groups and 50 goals, and a connection up to 5,000 values across its rules. Creating one more,
      or saving a connection with more values, is a `400` with a message such as "You can have
      up to 100 connections."

    ## Responses and errors

    Successful responses are JSON. Creates return `201`, everything else `200`. Deletes return
    `{"deleted": true}`.

    Errors return `{"error": "<message>"}`. Besides the statuses listed on each operation, a
    path that exists but not with the method sent returns `405`, with an `Allow` header listing
    the methods it takes, and an unknown path returns `404`.

    Ids are UUIDs. Times are ISO 8601 in UTC.
servers:
  - url: https://api.longlines.io/v1
security:
  - apiToken: [read]
tags:
  - name: Destinations
    description: |
      A destination is where matching spots go: a Discord channel webhook, your own HTTPS
      webhook, or push notifications to your devices. See
      [WEBHOOKS.md](https://github.com/sonyccd/longlines/blob/main/docs/WEBHOOKS.md) for the
      webhook payload and its signature. The API never returns a destination's URL, only
      `url_display`, a masked form.

      An account can have several push destinations. A push destination has no URL
      (`url_display` is "Your devices"); it reaches the devices picked for it in the web app.
      Devices, and which destination gets which, can only be managed from a browser signed in
      to Long Lines. The API creates, lists, tests, renames, turns off and deletes push
      destinations, and shows their notification settings and how many devices they have, but
      never the devices.

      Names are unique per account across every type, ignoring case. A name already in use is
      a `400`: "A destination named {name} already exists. Choose a different name."

      The API does not change a destination's push, Discord or webhook settings, or a
      webhook's extra headers; the web app's editor does.
  - name: Connections
    description: A connection says which spots you want and where to send them.
  - name: Callsign groups
    description: |
      A group is a named list of up to 1,000 callsigns, such as a club roster. Point
      connections at a group with a `group` rule. Adding a member to the group changes what
      every connection using it matches, and you don't need to save the connections again.

      Members are stored as base calls: adding `KN4XYZ/P` stores `KN4XYZ`, which matches
      `KN4XYZ` and any portable or prefixed form of it. Removing works the same way. A call that
      isn't a valid callsign refuses the whole request with `400` and "Not a callsign: …", and
      nothing changes.

      The two `members` routes change the list in one step, so two scripts adding members at
      the same time don't lose each other's changes.
  - name: Goals
    description: |
      A goal is what you're still chasing: US states, POTA parks, bands. Point a
      connection at one with a `goal` rule and it stops alerting for anything you've
      already worked. A list has one or more requirements, each of one kind with its entries
      and a "Complete when" rule: all of them, or at least some number of them.

      An entry is worked when you log a contact through Long Lines Relay inside the list's
      dates (with `marking` `relay`), or when you mark it by hand. A contact's park comes from a
      POTA spot of that station within 30 minutes either side of it; when there is none, or
      spots at two parks, the contact is listed in `reviews` for you to pick the park or say it
      wasn't a park contact. A spot alone never works an entry.

      A list is `complete` when every requirement is, and `ended` once its end date has passed.
      Either way its rule is off on every connection that has it: those connections alert for
      everything their other rules allow. A goal a connection uses can't be deleted
      (`409`).

paths:
  /destinations:
    get:
      operationId: list_destinations
      tags: [Destinations]
      summary: List your destinations
      responses:
        "200":
          description: All your destinations, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Destination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: create_destination
      tags: [Destinations]
      summary: Create a destination
      description: |
        A webhook gets its `signing_secret` here, shown only once, and starts with the default
        payload and delivery settings. A new push destination has the default notification
        settings and no devices. The answer is a short form of the destination; get it to see
        its settings. A Local DX cluster is added only in the web app, which picks its relay
        (400 "Add a Local DX cluster destination in the web app.").
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinationCreate" }
            examples:
              discord:
                value:
                  type: discord
                  name: "Club #spots"
                  url: "https://discord.com/api/webhooks/…"
              push:
                value: { type: push, name: My phone }
      responses:
        "201":
          description: The destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DestinationCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /destinations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: get_destination
      tags: [Destinations]
      summary: Get a destination
      responses:
        "200":
          description: The destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Destination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: update_destination
      tags: [Destinations]
      summary: Rename, re-point or turn a destination on or off
      description: |
        The type can't change, and a push destination takes no `url`. A new `url` clears
        `failing` health and the failure count, and removes a webhook's extra headers, since
        their values were meant for the old address. `"enabled": false` stops new spots going to it
        and drops the ones already queued; connections that use it keep their other
        destinations. `"enabled": true` on a paused destination (a webhook that paused itself
        after repeated failures or on an HTTP 410, or a Discord destination whose webhook Discord
        said no longer exists) resumes it and starts its failure counts again. Fields left out,
        or sent as `null`, keep their values.
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinationPatch" }
      responses:
        "200":
          description: The destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Destination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: delete_destination
      tags: [Destinations]
      summary: Delete a destination
      description: |
        Connections that send to it lose it. A connection left with no destinations stays saved
        and sends nothing until one is added.
      security:
        - apiToken: [write]
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /destinations/{id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rotate_signing_secret
      tags: [Destinations]
      summary: Give a webhook a new signing secret
      description: The old secret stops working. The new one is shown only here.
      security:
        - apiToken: [write]
      responses:
        "200":
          description: The new secret.
          content:
            application/json:
              schema:
                type: object
                required: [signing_secret]
                properties:
                  signing_secret: { type: string, examples: ["whsec_…"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /destinations/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: send_test
      tags: [Destinations]
      summary: Send a sample spot
      description: |
        Delivers a sample spot the way real spots go: for push, to at least one of its devices,
        with the notification text its saved fields build; for Discord, as the message its saved
        settings build, marked as a test; for a webhook, as the body its saved settings build,
        with its extra headers and `X-LongLines-Test: true`. A Local DX cluster destination has
        no test here (400 "Send a test spot from the relay."): only Long Lines Relay's own "Send
        test spot" reaches its DX cluster.
      security:
        - apiToken: [write]
      responses:
        "200":
          description: The sample spot was delivered.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  status:
                    type: integer
                    description: For a webhook, the HTTP status the receiver answered.
              examples:
                webhook: { value: { ok: true, status: 204 } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: |
            Too many requests (see Limits), or the destination asked Long Lines to slow down and
            is being held back: "This destination asked Long Lines to slow down. Try the test
            again in a few minutes."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502":
          description: The delivery failed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      status:
                        type: integer
                        description: |
                          For a webhook, the HTTP status the receiver answered. A request that
                          got no answer has none.
              examples:
                webhook: { value: { error: Webhook HTTP 500, status: 500 } }

  /destinations/{id}/clear:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: clear_destination_queue
      tags: [Destinations]
      summary: Drop the spots waiting to be sent
      description: |
        Drops the destination's spots that are waiting to be sent and answers how many were
        dropped. Spots already being sent, or waiting to be retried, are not affected. New spots
        keep coming. Dropped spots are not sent later.
      security:
        - apiToken: [write]
      responses:
        "200":
          description: How many waiting spots were dropped.
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: integer, minimum: 0 }
              examples:
                cleared: { value: { cleared: 140 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /connections:
    get:
      operationId: list_connections
      tags: [Connections]
      summary: List your connections
      responses:
        "200":
          description: All your connections, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: create_connection
      tags: [Connections]
      summary: Create a connection
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ConnectionInput"
                - required: [name]
            example:
              name: Members on the air
              sources: [pota, sotawatch]
              rules: [[{ field: group, op: is, values: ["<group id>"] }]]
              destinations: ["<destination id>"]
      responses:
        "201":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /connections/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: get_connection
      tags: [Connections]
      summary: Get a connection
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      operationId: replace_connection
      tags: [Connections]
      summary: Replace a connection
      description: |
        `sources` and `destinations` left out become empty; `rules`, `enabled` and
        `quiet_minutes` left out keep their values (send `"rules": []` to clear the filter).
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ConnectionInput"
                - required: [name]
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: patch_connection
      tags: [Connections]
      summary: Change some of a connection's fields
      description: |
        Fields left out keep their values, and so do `name`, `enabled` and `quiet_minutes` sent
        as `null`. A list can't be `null`: send `[]` to empty it.
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionInput" }
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: delete_connection
      tags: [Connections]
      summary: Delete a connection
      security:
        - apiToken: [write]
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /groups:
    get:
      operationId: list_groups
      tags: [Callsign groups]
      summary: List your callsign groups
      responses:
        "200":
          description: All your groups, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: create_group
      tags: [Callsign groups]
      summary: Create a callsign group
      description: Names are unique per account, ignoring case.
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GroupInput"
                - required: [name]
            example: { name: Club members }
      responses:
        "201":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: get_group
      tags: [Callsign groups]
      summary: Get a callsign group
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: update_group
      tags: [Callsign groups]
      summary: Rename a group or replace its members
      description: |
        A `callsigns` list replaces the whole member list. A `name` left out, or sent as `null`,
        stays.
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: delete_group
      tags: [Callsign groups]
      summary: Delete a callsign group
      security:
        - apiToken: [write]
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InUse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /groups/{id}/members:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: add_group_members
      tags: [Callsign groups]
      summary: Add members
      description: Calls already in the group are skipped.
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Callsigns" }
            example: { callsigns: [KN4XYZ] }
      responses:
        "200":
          description: The group, after adding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /groups/{id}/members/remove:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: remove_group_members
      tags: [Callsign groups]
      summary: Remove members
      description: Calls not in the group are ignored.
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Callsigns" }
            example: { callsigns: [W1OLD] }
      responses:
        "200":
          description: The group, after removing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /goals:
    get:
      operationId: list_goals
      tags: [Goals]
      summary: List your goals
      responses:
        "200":
          description: All your goals, by name, as their summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GoalCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: create_goal
      tags: [Goals]
      summary: Create a goal
      description: |
        Names are unique per account, ignoring case. Contacts you have already logged inside the
        list's dates mark its entries straight away.
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalInput" }
            example:
              name: 2026 chase
              starts_on: "2026-01-01"
              ends_on: "2026-12-31"
              requirements:
                - { kind: state, entries: [NC, VA, SC] }
                - { kind: band, complete_when: at_least, at_least: 4, entries: [80m, 40m, 20m, 17m, 15m, 10m] }
      responses:
        "201":
          description: The goal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /goals/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: get_goal
      tags: [Goals]
      summary: Get a goal with its progress
      responses:
        "200":
          description: The goal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      operationId: replace_goal
      tags: [Goals]
      summary: Replace a goal
      description: |
        Sends the whole list: anything left out goes back to its default, and a requirement or
        entry left out is removed. Send each requirement's `id` to keep the entries you marked
        by hand. After the save, the contacts inside the new dates are checked again, so
        changing the dates can set worked entries back to needed.
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalInput" }
      responses:
        "200":
          description: The goal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: delete_goal
      tags: [Goals]
      summary: Delete a goal
      description: Refused with `409` while any of your connections has a `goal` rule naming it.
      security:
        - apiToken: [write]
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InUse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /goals/{id}/entries:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: mark_goal_entry
      tags: [Goals]
      summary: Mark an entry worked or needed by hand
      description: |
        `worked: true` marks the entry worked now; an entry already worked keeps its mark.
        `worked: false` sets it back to needed, and only a contact logged after that marks it
        again. A requirement that isn't this goal's is a `400`: "Requirement not found."
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalEntryMark" }
            example: { requirement_id: 4b0e…, value: NC, worked: true }
      responses:
        "200":
          description: The goal, after marking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /goals/{id}/reviews:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resolve_goal_review
      tags: [Goals]
      summary: Pick the park of a contact that needs a look
      description: |
        A `reference` picks the park, which marks it worked where the list still needs it, with
        the contact as its evidence. `null` says it wasn't a park contact. Either way the review
        is resolved and stays resolved. A review that isn't this goal's, or is already
        resolved, is a `400`: "Review not found."
      security:
        - apiToken: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalReviewResolve" }
            example: { review_id: 7f2a…, reference: US-2763 }
      responses:
        "200":
          description: The goal, after resolving.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReadOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: |
        A personal API token from the API tokens page (`ll_live_` and 52 more characters). A
        `read` token can call only `GET` routes; routes that change something need `write`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The object's id. Any case; a value that isn't a UUID is a `404`.
      schema: { type: string, format: uuid }

  responses:
    Deleted:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            required: [deleted]
            properties:
              deleted: { const: true }
    BadRequest:
      description: |
        The request was invalid. The message says why, for example "Give the connection a
        name."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: The token is missing, malformed, unknown, revoked or expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReadOnly:
      description: A read-only token tried to change something.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The connection, destination, group or goal doesn't exist or isn't yours.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InUse:
      description: |
        The group or goal is still used by a connection: "Remove it from its connections
        first."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The request body is larger than 256 KB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: More than 60 requests this minute from this token.
      headers:
        Retry-After:
          description: Seconds until the next minute.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Something went wrong on our side. Try again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Source:
      type: string
      enum: [pota, sotawatch, wwff, wwbota, rbn, dxcluster, logged, aprs]

    PushField:
      type: string
      enum: [callsign, first_name, last_name, frequency, band, mode, source, reference,
             place_name, state, spotter, comment, time]

    DiscordField:
      type: string
      enum: [callsign, first_name, last_name, frequency, band, mode, source, reference,
             place_name, state, spotter, time]

    WebhookField:
      type: string
      enum: [id, time, callsign, first_name, last_name, frequency, mode, band, source, reference,
             place_name, state, spotter, country, url, comment]

    DestinationCreate:
      oneOf:
        - type: object
          title: Discord or webhook
          required: [type, name, url]
          properties:
            type: { type: string, enum: [discord, webhook] }
            name: { type: string }
            url:
              type: string
              format: uri
              description: |
                A Discord channel webhook URL, or your own HTTPS URL for a webhook.
        - type: object
          title: Push
          required: [type, name]
          properties:
            type: { const: push }
            name: { type: string }

    DestinationCreated:
      type: object
      required: [id, type, name, url_display, health, created_at, signing_secret]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [discord, webhook, push] }
        name: { type: string }
        url_display: { type: string }
        health: { type: string, enum: [ok, failing, paused] }
        created_at: { type: string, format: date-time }
        signing_secret:
          type: [string, "null"]
          description: |
            A webhook's signing secret, shown only here and from `rotate-secret`. Null for other
            types.

    DestinationPatch:
      type: object
      properties:
        name: { type: [string, "null"] }
        url: { type: [string, "null"], format: uri }
        enabled: { type: [boolean, "null"] }

    Destination:
      type: object
      required: [id, type, name, url_display, enabled, health, consecutive_failures,
                 last_success_at, last_error, last_error_at, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [discord, webhook, push, local_cluster] }
        name: { type: string }
        url_display:
          type: string
          description: |
            A masked form of the URL; "Your devices" for push, "Long Lines Relay" for a Local
            DX cluster.
        enabled: { type: boolean }
        health: { type: string, enum: [ok, failing, paused] }
        consecutive_failures: { type: integer }
        last_success_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        last_error_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        push: { $ref: "#/components/schemas/PushSettings" }
        discord: { $ref: "#/components/schemas/DiscordSettings" }
        webhook: { $ref: "#/components/schemas/WebhookSettings" }
        local_cluster: { $ref: "#/components/schemas/LocalClusterSettings" }
      example:
        id: 4b0e…
        type: discord
        name: "Club #spots"
        url_display: "https://discord.com/api/webhooks/1234…/abc"
        enabled: true
        health: ok
        consecutive_failures: 0
        last_success_at: "2026-10-13T14:02:11Z"
        last_error: null
        last_error_at: null
        created_at: "2026-10-01T18:30:00Z"

    PushSettings:
      type: object
      description: |
        A push destination's notification settings as the web app's editor sets them, and how
        many devices it reaches. The title and body are ordered lists of fields; there is no
        custom text. Only on push destinations.
      properties:
        title_fields: { type: array, items: { $ref: "#/components/schemas/PushField" }, minItems: 1, maxItems: 4 }
        body_fields: { type: array, items: { $ref: "#/components/schemas/PushField" }, maxItems: 8 }
        show_field_names: { type: boolean }
        body_separator: { type: string, enum: [dot, comma, newline] }
        tap_target: { type: string, enum: [profile, source] }
        action_buttons: { type: boolean }
        urgency: { type: string, enum: [low, normal, high] }
        ttl_seconds: { type: integer, enum: [300, 900, 1800, 3600, 14400] }
        replace_same_station: { type: boolean }
        sound: { type: boolean }
        quiet_enabled: { type: boolean }
        quiet_from: { type: string, examples: ["22:00:00"] }
        quiet_until: { type: string, examples: ["07:00:00"] }
        quiet_mode: { type: string, enum: [silent, skip] }
        device_count: { type: integer }
      example:
        title_fields: [callsign, frequency, mode]
        body_fields: [source, reference, place_name, state]
        show_field_names: false
        body_separator: dot
        tap_target: profile
        action_buttons: true
        urgency: normal
        ttl_seconds: 1800
        replace_same_station: true
        sound: true
        quiet_enabled: false
        quiet_from: "22:00:00"
        quiet_until: "07:00:00"
        quiet_mode: silent
        device_count: 2

    DiscordSettings:
      type: object
      description: |
        A Discord destination's message settings as the web app's editor sets them. The card's
        title, details and small grid and the plain line are ordered lists of fields; there is
        no custom text, and mentions such as @everyone are always off. Only on Discord
        destinations.
      properties:
        style: { type: string, enum: [card, plain] }
        title_fields: { type: array, items: { $ref: "#/components/schemas/DiscordField" }, minItems: 1, maxItems: 4 }
        detail_fields: { type: array, items: { $ref: "#/components/schemas/DiscordField" }, maxItems: 8 }
        grid_fields: { type: array, items: { $ref: "#/components/schemas/DiscordField" }, maxItems: 6 }
        title_link: { type: string, enum: [profile, source, none] }
        card_color: { type: string, enum: [source, blue, green, purple, orange, red, grey] }
        footer: { type: boolean }
        line_fields: { type: array, items: { $ref: "#/components/schemas/DiscordField" }, minItems: 1, maxItems: 8 }
        bold_first: { type: boolean }
        link_preview: { type: string, enum: [hidden, shown] }
        show_field_names: { type: boolean }
        separator: { type: string, enum: [dot, comma, newline] }
        batch_seconds:
          type: integer
          enum: [0, 10, 30, 60]
          description: 0 for one message per spot, or a window whose spots go in one message.
        auto_disabled_at:
          type: [string, "null"]
          format: date-time
          description: |
            Set while the destination is paused because Discord said its webhook no longer
            exists. Spots waiting to be sent were dropped; `"enabled": true` resumes it.
      example:
        style: card
        title_fields: [callsign, frequency, mode]
        detail_fields: [source, reference, place_name, state]
        grid_fields: [band, spotter]
        title_link: profile
        card_color: source
        footer: true
        line_fields: [callsign, frequency, mode, source, reference, place_name]
        bold_first: true
        link_preview: hidden
        show_field_names: false
        separator: dot
        batch_seconds: 0
        auto_disabled_at: null

    LocalClusterField:
      type: string
      enum: [reference, source, comment]

    LocalClusterSettings:
      type: object
      description: |
        A Local DX cluster's relay and spot line as the web app's editor sets them. Each spot
        goes to that relay, which serves it as a DX cluster line to logging software on its
        computer; the line's comment is the mode, then these fields in order. Spots are dropped
        while the relay is offline. The API can read and rename one, but cannot create one, give
        it a URL or send it a test. Only on Local DX cluster destinations.
      required: [relay_id, relay_name, fields]
      properties:
        relay_id:
          type: [string, "null"]
          format: uuid
          description: The relay's id, or null once that relay was revoked.
        relay_name:
          type: [string, "null"]
          description: The relay's device name, or null once it was revoked.
        fields: { type: array, items: { $ref: "#/components/schemas/LocalClusterField" }, maxItems: 3 }
      example:
        relay_id: 5a0a0000-0000-4000-8000-0000000000aa
        relay_name: SHACK-PC
        fields: [reference]

    WebhookSettings:
      type: object
      description: |
        A webhook's payload and delivery settings as the web app's editor sets them (see
        WEBHOOKS.md). Only on webhook destinations.
      properties:
        fields: { type: array, items: { $ref: "#/components/schemas/WebhookField" } }
        key_style: { type: string, enum: [snake, camel] }
        time_format: { type: string, enum: [iso_utc, unix_seconds] }
        frequency_unit: { type: string, enum: [khz, mhz, hz] }
        missing_values: { type: string, enum: [omit, "null"] }
        batch_seconds:
          type: integer
          enum: [0, 10, 30, 60]
          description: 0 for one request per spot, or a window whose spots go in one request.
        retry_policy: { type: string, enum: [none, three_10m, day] }
        pause_after_failures:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: Failed requests that turn the destination off, or null for never.
        headers:
          type: array
          description: The extra headers' names. Their values are never returned.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
        secret_rotated_at: { type: [string, "null"], format: date-time }
        auto_disabled_at:
          type: [string, "null"]
          format: date-time
          description: |
            Set while the destination is paused: after repeated failures, or at once when the
            receiver answered HTTP 410 (gone).
      example:
        fields: [id, time, callsign, frequency, mode, band, source, reference, place_name,
                 state, spotter]
        key_style: snake
        time_format: iso_utc
        frequency_unit: khz
        missing_values: omit
        batch_seconds: 0
        retry_policy: three_10m
        pause_after_failures: 20
        headers: [{ name: Authorization }]
        secret_rotated_at: "2026-10-06T14:02:11Z"
        auto_disabled_at: null

    ConnectionInput:
      type: object
      properties:
        name: { type: [string, "null"] }
        enabled:
          type: [boolean, "null"]
          description: Defaults to `true`.
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }
          description: |
            Empty means any. A DX Cluster spot only matches a connection that lists
            `dxcluster`, a WWFF spot one that lists `wwff`, a WWBOTA spot one that lists `wwbota`,
            a logged contact (posted by Long Lines Relay) one that lists `logged`, and an
            APRS-IS spot (a position beacon from a station a connection names, at most one per
            station every 15 minutes, with no frequency, band or mode) one that lists `aprs`.
        rules: { $ref: "#/components/schemas/Rules" }
        quiet_minutes:
          type: [integer, "null"]
          enum: [0, 5, 10, 30, 60, null]
          description: Defaults to 10.
        destinations:
          type: array
          items: { type: string, format: uuid }
          description: |
            Zero or more of your destinations. With none, the connection stays off whatever
            `enabled` says, and starts once it has one.

    Connection:
      type: object
      required: [id, name, enabled, sources, rules, quiet_minutes, destinations, created_at,
                 updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
        rules: { $ref: "#/components/schemas/Rules" }
        quiet_minutes: { type: integer, enum: [0, 5, 10, 30, 60] }
        destinations: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Rules:
      type: array
      description: |
        The filter: a list of groups, and each group a list of rules. A spot passes when it
        passes every rule in at least one group: rules in a group are joined by "and", and
        groups by "or". The web app shows the same thing as one list where each rule after the
        first says And or Or, with And binding tighter. `[]` passes every spot and is the
        default.

        A connection can have at most 50 rules, and each group needs at least one. RBN and
        APRS-IS spots only pass a group that has a `callsign` or `group` rule with `is`, so a
        connection whose only sources are `rbn` and `aprs` needs one in every group.
      items:
        type: array
        minItems: 1
        items: { $ref: "#/components/schemas/Rule" }
      example:
        - - { field: band, op: is, values: [20m] }
          - { field: mode, op: is, values: [cw] }
        - - { field: callsign, op: is, values: [W1AW] }

    Rule:
      type: object
      description: |
        `is` passes a spot that has any of the values and `is_not` one that has none of them,
        so a spot with no band passes `band is_not 20m`.

        | `field` | `op` | `values` |
        |---|---|---|
        | `callsign` | `is`, `is_not` | Calls, uppercased for you. A call matches exactly or by its base call. |
        | `group` | `is`, `is_not` | Callsign group ids. A spot's base call is checked against the members. |
        | `band` | `is`, `is_not` | Bands, for example `20m`, lowercased for you. |
        | `mode` | `is`, `is_not` | Modes or mode families, for example `cw`, `ft8`, `digital`. |
        | `reference` | `is`, `is_not` | References, uppercased for you, such as `US-2763`, `W4C/CM-001` or `KFF-6101`. Each must equal one of the spot's references: its POTA park, SOTA summit, WWFF reference, any of a WWBOTA spot's bunkers or a DX Cluster spot's IOTA reference, so `US-1000` never matches `US-10000`. A reference need not be in a program's list; a spot without one passes `is_not`. At most 64 characters each, of letters, digits, `/` and `-`. |
        | `reference` | `contains`, `not_contains` | Text to look for in a POTA reference or location, a SOTA summit code, a WWFF reference, any of a WWBOTA spot's bunkers or a DX Cluster spot's IOTA reference, such as `US-NC`, `KFF-`, `B/G-` or `EU-005`. Ignores case. |
        | `frequency` | `is`, `is_not`, `gt`, `lt` | One number, in kHz. `gt` is greater than and `lt` less than. |
        | `island` | `is`, `is_not` | IOTA references (`EU-005`) or continents (`EU`, every island on it), uppercased for you. Only DX Cluster spots name an island, read from the comment; a spot without one passes `is_not`. |
        | `goal` | `is` | One goal id, of your own. A spot passes while it matches an entry still needed (its band, its POTA park, or its US state: a POTA spot's park location, and for a park in several states the call's license state only when it is one of them, or the license state of the call for a spot without a park) in a requirement that is not complete. A complete or ended list passes every spot. |
      required: [field, op, values]
      properties:
        field: { type: string, enum: [callsign, group, band, mode, reference, frequency, island, goal] }
        op: { type: string, enum: [is, is_not, contains, not_contains, gt, lt] }
        values:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: [string, number] }

    GroupInput:
      type: object
      properties:
        name: { type: [string, "null"] }
        callsigns:
          type: array
          maxItems: 1000
          items: { type: string }

    Callsigns:
      type: object
      required: [callsigns]
      properties:
        callsigns:
          type: array
          maxItems: 2000
          items: { type: string }

    Group:
      type: object
      required: [id, name, callsigns, member_count, connection_count, updated_at, on_air]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        callsigns:
          type: array
          items: { type: string }
          description: Base calls, sorted.
        member_count: { type: integer }
        connection_count: { type: integer, description: Connections that use the group. }
        updated_at: { type: string, format: date-time }
        on_air:
          type: object
          description: The members spotted in the last 30 minutes, with the newest of those spots.
          required: [count, latest]
          properties:
            count: { type: integer }
            latest:
              type: [object, "null"]
              properties:
                callsign: { type: string }
                frequency_khz: { type: [number, "null"] }
                band: { type: [string, "null"] }
                mode: { type: [string, "null"] }
                source: { $ref: "#/components/schemas/Source" }
                reference:
                  type: [string, "null"]
                  description: The POTA, SOTA or WWFF reference, a WWBOTA spot's bunkers joined with ", ", or a DX Cluster spot's IOTA reference, whichever the spot has.
                spot_time: { type: string, format: date-time }
      example:
        id: 9c1d…
        name: Club members
        callsigns: [KK4PWJ, N4DXX]
        member_count: 2
        connection_count: 1
        updated_at: "2026-10-13T18:40:00Z"
        on_air:
          count: 1
          latest:
            callsign: KK4PWJ/P
            frequency_khz: 14062
            band: 20m
            mode: CW
            source: pota
            reference: US-1234
            spot_time: "2026-10-13T18:31:07Z"

    GoalInput:
      type: object
      required: [name, requirements]
      properties:
        name: { type: [string, "null"] }
        starts_on:
          type: [string, "null"]
          format: date
          description: |
            The first UTC day whose contacts count, as `YYYY-MM-DD`. Send both dates (between
            dates, for a contest or a calendar-year award) or neither (no end date, for a
            lifetime award like POTA hunter).
        ends_on:
          type: [string, "null"]
          format: date
          description: The last UTC day whose contacts count. It can't be before `starts_on`.
        marking:
          type: [string, "null"]
          enum: [relay, hand, null]
          description: |
            `relay` (the default): from your log, using Long Lines Relay, and you can still mark
            by hand. `hand`: by hand only.
        requirements:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/GoalRequirementInput" }

    GoalRequirementInput:
      type: object
      required: [kind, entries]
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: |
            The requirement's id from a read. Send it to keep the entries you marked by hand; a
            requirement without one is new, and only your contacts mark its entries.
        kind: { type: string, enum: [state, park, band] }
        complete_when:
          type: [string, "null"]
          enum: [all, at_least, null]
          description: Defaults to `all`.
        at_least:
          type: [integer, "null"]
          minimum: 1
          description: |
            With `complete_when: at_least`, how many worked entries complete the requirement. It
            must be smaller than the number of entries. Once that many are worked, the rest stop
            alerting too.
        entries:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string }
          description: |
            `state`: two-letter codes of the 50 states (no DC), uppercased for you. `park`: POTA
            references such as `US-2763`, uppercased for you; they need not be in the POTA list.
            `band`: band names such as `20m`, lowercased for you. Each value is kept once.

    GoalEntryMark:
      type: object
      required: [requirement_id, value, worked]
      properties:
        requirement_id: { type: [string, "null"], format: uuid }
        value:
          type: [string, "null"]
          description: The entry, for example `NC`, `US-2763` or `20m`.
        worked: { type: [boolean, "null"] }

    GoalReviewResolve:
      type: object
      required: [review_id, reference]
      properties:
        review_id: { type: [string, "null"], format: uuid }
        reference:
          type: [string, "null"]
          description: The park the contact was at, such as `US-2763`, or `null` for not a park contact.

    GoalCard:
      type: object
      required: [id, name, starts_on, ends_on, marking, status, completed_at, requirement_count,
                 worked, total, needed_by_kind, connection_count, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        starts_on: { type: [string, "null"], format: date }
        ends_on: { type: [string, "null"], format: date }
        marking: { type: string, enum: [relay, hand] }
        status:
          type: string
          enum: [active, complete, ended]
          description: |
            `complete` once every requirement is complete, `ended` after `ends_on` (UTC) when it
            isn't, else `active`. A complete or ended list's rule passes every spot.
        completed_at: { type: [string, "null"], format: date-time }
        requirement_count: { type: integer }
        worked:
          type: integer
          description: Worked entries, each requirement counted up to what completes it.
        total: { type: integer, description: The entries that complete every requirement. }
        needed_by_kind:
          type: object
          description: Entries still needed by requirements that aren't complete, by kind.
          required: [state, park, band]
          properties:
            state: { type: integer }
            park: { type: integer }
            band: { type: integer }
        connection_count: { type: integer, description: Connections whose rules name the list. }
        updated_at: { type: string, format: date-time }

    Goal:
      allOf:
        - $ref: "#/components/schemas/GoalCard"
        - type: object
          required: [requirements, reviews, relay, used_by, first_contact_at]
          properties:
            requirements:
              type: array
              items:
                type: object
                required: [id, kind, complete_when, at_least, position, complete, worked, target,
                           entries]
                properties:
                  id: { type: string, format: uuid }
                  kind: { type: string, enum: [state, park, band] }
                  complete_when: { type: string, enum: [all, at_least] }
                  at_least: { type: [integer, "null"] }
                  position: { type: integer }
                  complete: { type: boolean }
                  worked:
                    type: integer
                    description: Worked entries, up to `target`.
                  target:
                    type: integer
                    description: The entry count for `all`, else `at_least`.
                  entries:
                    type: array
                    items:
                      type: object
                      required: [value, label, position, worked_at, worked_how, evidence]
                      properties:
                        value: { type: string }
                        label:
                          type: [string, "null"]
                          description: A park's name from the POTA list; null for states and bands.
                        position: { type: integer }
                        worked_at: { type: [string, "null"], format: date-time }
                        worked_how: { type: [string, "null"], enum: [contact, hand, null] }
                        evidence:
                          type: [object, "null"]
                          description: For an entry a contact worked, the contact and the POTA spot its park came from.
                          properties:
                            worked_call: { type: string }
                            contact_time: { type: string, format: date-time }
                            logger_app: { type: [string, "null"] }
                            matched_spot_time: { type: [string, "null"], format: date-time }
            reviews:
              type: array
              description: |
                Contacts that need a look: no POTA spot of that station within 30 minutes either
                side, or spots at two parks, while a park requirement isn't complete. Newest first.
              items:
                type: object
                required: [id, worked_call, band, mode, contact_time, candidates]
                properties:
                  id: { type: string, format: uuid }
                  worked_call: { type: string }
                  band: { type: [string, "null"] }
                  mode: { type: [string, "null"] }
                  contact_time: { type: string, format: date-time }
                  candidates:
                    type: array
                    description: The parks spotted in the window; empty when there were none.
                    items:
                      type: object
                      required: [reference, name]
                      properties:
                        reference: { type: string }
                        name: { type: [string, "null"] }
            relay:
              type: object
              description: |
                Whether Long Lines Relay is sending your contacts: `recent` with a contact in the
                last 7 days, `never` with no relay paired and no contact, else `stale`.
              required: [status, last_contact_at, logger_app, relay_count]
              properties:
                status: { type: string, enum: [never, recent, stale] }
                last_contact_at: { type: [string, "null"], format: date-time }
                logger_app: { type: [string, "null"] }
                relay_count: { type: integer }
            used_by:
              type: array
              description: The connections whose rules name the list.
              items:
                type: object
                required: [id, name, sources, destination_count]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
                  destination_count: { type: integer }
            first_contact_at:
              type: [string, "null"]
              format: date-time
              description: When Long Lines got your first logged contact; earlier contacts are marked by hand.
