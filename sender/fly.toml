# Fly.io app for the outbound sender (sender/). Each Fly app's config lives in
# its own folder (inbound/fly.toml, sender/fly.toml); Fly's GitHub integration for
# this app has "Config path" set to sender/fly.toml and the working directory
# left at the repository root, so the build context is the root and the image
# gets supabase/functions/_shared. To deploy by hand from the root:
#   fly deploy --config sender/fly.toml --ha=false
#
# Exactly one machine may run (fly scale count 1 -a longlines-sender). The
# claim is a serial consumer whose marks land before its next claim; a second
# machine would send duplicates, throttle destinations without coordination
# and split the counts. The app's own network (--network sender at creation)
# keeps the inbound worker and anything else off its 6PN.
#
# Secrets (fly secrets set -a longlines-sender ...): SENDER_DATABASE_URL (the
# delivery_sender role through the Supavisor pooler, session mode, port 5432)
# and the VAPID triple LONGLINES_VAPID_PUBLIC_KEY / LONGLINES_VAPID_PRIVATE_KEY /
# LONGLINES_VAPID_SUBJECT. Optional: SENDER_DATABASE_CA, the PEM certificate
# the pooler's certificate must chain to (without it TLS is not verified;
# docs/OPERATIONS.md). Never a Supabase API key. Knobs (SENDER_POLL_MS,
# SENDER_CONCURRENCY, SENDER_STALE_MS, SENDER_STATS_MS, SENDER_HEALTH_PORT) are
# optional; sender/config.ts has the defaults.

app = "longlines-sender"
primary_region = "iad"

# Relative to this file's directory (flyctl resolves it from the config's
# location, not from the build context), so not "sender/Dockerfile".
[build]
  dockerfile = "Dockerfile"

# main.ts stops claiming on SIGINT and waits for the cycle in flight to finish
# its sends and marks before exiting; there is no drain deadline, and a send
# already started runs to its own 10 s timeout. 30 s covers an ordinary cycle
# but not every one: a full claim spread over many slow destinations (10 s per
# request, four destinations at a time) can run for minutes. Fly kills the
# process at kill_timeout, and whatever that cycle had not yet acked
# reappears after the 60 s visibility timeout and is sent once more.
kill_signal = "SIGINT"
kill_timeout = "30s"

# Restart the process whenever it exits, however often. The default on-failure
# policy gives up after a few restarts, which would leave the sender down after
# a long database outage even once the database is back (start-up itself
# retries for five minutes before exiting 1). A stop made through Fly
# (deploy, fly machine stop) is not an exit this policy restarts.
[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# No [http_service]: the sender accepts no public traffic, and an http_service
# with auto_stop_machines would stop the machine for lack of requests. The check
# reaches the health port over Fly's private network and shows in
# `fly checks list`; a 503 restarts nothing, the watchdog's exit 1 does.
[checks]
  [checks.healthz]
    type = "http"
    port = 8080
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
