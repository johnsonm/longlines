# fly.toml app configuration file generated for longlines-inbound on 2026-10-28T17:31:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'longlines-inbound'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[checks]
  [checks.healthz]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[[restart]]
  policy = "always"
