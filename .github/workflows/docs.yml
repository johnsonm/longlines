name: Docs site

# The docs site's PR check, apart from ci.yml so it runs only when the site changes and a PR that
# changes only the site skips the app's checks. deploy-docs.yml is the only thing that publishes it.
on:
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"

# A new push to a PR cancels the run for the commit it replaces.
concurrency:
  group: docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      # Node 24, as the deploy workflow's withastro/action uses; Astro needs 22.12 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      # Only builds; deploy-docs.yml is the only thing that publishes the site.
      - run: npm run build
