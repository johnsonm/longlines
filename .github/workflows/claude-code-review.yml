name: Claude Code Review

# Runs only when asked: a PR comment that starts with `/claude-review`. Pushes never start
# a review, so a PR can take any number of commits (and preview deploys) before one is wanted.
# The command has no `@claude` in it, so the assistant workflow (claude.yml) stays out of it.
on:
  issue_comment:
    types: [created]

# Asking again while a review runs cancels the older one, so only the latest head is reviewed.
# Every other comment gets a group of its own: a run whose job is skipped still takes its group,
# so one shared group let any comment (the review's own summary, Vercel's, Codecov's) cancel a
# review in progress.
concurrency:
  group: claude-review-${{ github.event.issue.number }}-${{ startsWith(github.event.comment.body, '/claude-review') && 'review' || github.run_id }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Only on PRs (issue_comment fires for issues too), and only for someone with write access to
    # the repo: it is public, and any GitHub account can comment.
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/claude-review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # Main, not the PR's head: this run holds secrets, so it never checks out PR code (CodeQL's
      # untrusted-checkout rule). The review reads the PR's diff through the GitHub API.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
