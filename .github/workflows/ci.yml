name: CI

# Pull requests only: a merge to main ships commits these checks already passed on their PR, so
# main does not run them again (run it by hand from the Actions tab if needed). Every PR runs this
# workflow so "CI passed", the check the main ruleset requires, always reports; `changes` decides
# which jobs a PR needs, and a job skipped by its `if` counts as passed.
on:
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the run for the commit it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job only checks out and runs checks; nothing writes to the repo or calls the API.
# The one outside call is the coverage upload to Codecov, which is best effort.
permissions:
  contents: read

jobs:
  # code: anything but Markdown, docs/ (except openapi.yaml, which openapi.test.ts reads), the docs
  # site, the issue templates and the other workflows; a new non-code file a test reads must count
  # as code here. docs: the docs site. A renamed file counts under both its names. A manual run
  # runs everything.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          code=false
          docs=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/ci.yml) code=true; docs=true ;;
              docs-site/*) docs=true ;;
              docs/openapi.yaml) code=true ;;
              *.md | docs/* | .github/ISSUE_TEMPLATE/* | .github/workflows/claude.yml | \
                .github/workflows/claude-code-review.yml | .github/workflows/deploy-docs.yml) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code docs=$docs"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  deno:
    name: Deno checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/functions scripts inbound sender deno.json
      - run: deno task lint
      - run: deno task check
      # Runs the tests and fails below 80% line coverage or when a module is never loaded.
      - run: deno task coverage
      # The 80% gate above is the check; Codecov only reports. Paths in this lcov are absolute.
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          flags: deno

  deno-eslint:
    name: Deno ESLint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      # Strict typescript-eslint over supabase/functions, inbound, sender and scripts;
      # areas not yet refactored are on eslint.config.ts's pending list.
      - run: npm run lint
      - run: npm run typecheck

  migrations:
    name: Migrations on fresh Postgres
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: "latest" makes setup-cli ask the GitHub API for the newest release,
      # and that call fails the job when the runner's shared rate limit is used up.
      # Bump it by hand, to the version local development runs (supabase --version).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Starts only the Postgres container and applies every migration.
      - run: supabase db start
      - run: supabase db lint --fail-on error
      - run: supabase test db
      # Exercises the RPCs, queue, cron jobs and grants against the applied schema.
      - name: Smoke test
        run: psql "$(supabase status -o env | grep '^DB_URL' | cut -d'"' -f2)" -v ON_ERROR_STOP=1 -X -f scripts/smoke-test.sql
      # The sender's postgres.js adapter against the applied schema: the RPC allowlist, int8 as Number.
      # The Deno job skips these tests (no database); here they run as the stack's postgres user.
      - name: Sender database adapter
        run: SENDER_TEST_DATABASE_URL="$(supabase status -o env | grep '^DB_URL' | cut -d'"' -f2)" deno test -P sender/__tests__/db.test.ts
      # cached_callsign_profile's build lock with two sessions (a builder and a waiter). Skipped by the Deno job.
      - name: Profile build lock
        run: PROFILE_LOCK_TEST_DATABASE_URL="$(supabase status -o env | grep '^DB_URL' | cut -d'"' -f2)" deno test -P supabase/functions/_shared/__tests__/profile_lock_db.test.ts

  web:
    name: Web app
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Runs the tests and fails below 80% lines, statements, functions or branches.
      - run: npm run coverage
      # `uses` steps ignore the job's working-directory, so the path is from the repo root.
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          disable_search: true
          flags: web
      # Build needs the public Supabase values; placeholders are fine for type-checking and bundling.
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: placeholder


  docs:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      # Node 24, as the deploy workflow's withastro/action uses; Astro needs 22.12 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      # Only builds; deploy-docs.yml is the only thing that publishes the site.
      - run: npm run build

  # The one check the main ruleset requires. It fails when any job above failed or was cancelled;
  # skipped jobs pass.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, deno, deno-eslint, migrations, web, docs]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
