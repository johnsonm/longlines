name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deno:
    name: Deno checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/functions scripts relay sender deno.json
      - run: deno task lint
      - run: deno task check
      # Runs the tests and fails below 80% line coverage or when a module is never loaded.
      - run: deno task coverage

  migrations:
    name: Migrations on fresh Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: "latest" makes setup-cli ask the GitHub API for the newest release,
      # and that call fails the job when the runner's shared rate limit is used up.
      # Bump it by hand, to the version local development runs (supabase --version).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Starts only the Postgres container and applies every migration.
      - run: supabase db start
      - run: supabase db lint --fail-on error
      - run: supabase test db
      # Exercises the RPCs, queue, cron jobs and grants against the applied schema.
      - name: Smoke test
        run: psql "$(supabase status -o env | grep '^DB_URL' | cut -d'"' -f2)" -v ON_ERROR_STOP=1 -X -f scripts/smoke-test.sql
      # The sender's postgres.js adapter against the applied schema: the RPC allowlist, int8 as Number.
      # The Deno job skips these tests (no database); here they run as the stack's postgres user.
      - name: Sender database adapter
        run: SENDER_TEST_DATABASE_URL="$(supabase status -o env | grep '^DB_URL' | cut -d'"' -f2)" deno test -P sender/__tests__/db.test.ts
      # cached_callsign_profile's build lock with two sessions (a builder and a waiter). Skipped by the Deno job.
      - name: Profile build lock
        run: PROFILE_LOCK_TEST_DATABASE_URL="$(supabase status -o env | grep '^DB_URL' | cut -d'"' -f2)" deno test -P supabase/functions/_shared/__tests__/profile_lock_db.test.ts

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Runs the tests and fails below 80% lines, statements, functions or branches.
      - run: npm run coverage
      # Build needs the public Supabase values; placeholders are fine for type-checking and bundling.
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: placeholder
