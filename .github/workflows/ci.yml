name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deno:
    name: Deno checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/functions scripts relay deno.json
      - run: deno task lint
      - run: deno task check
      # Runs the tests and fails below 80% line coverage or when a module is never loaded.
      - run: deno task coverage

  migrations:
    name: Migrations on fresh Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Starts only the Postgres container and applies every migration.
      - run: supabase db start
      - run: supabase db lint --fail-on error
      - run: supabase test db
      # Exercises the RPCs, queue, cron jobs and grants against the applied schema.
      - name: Smoke test
        run: psql "$(supabase status -o env | grep '^DB_URL' | cut -d'"' -f2)" -v ON_ERROR_STOP=1 -X -f scripts/smoke-test.sql

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Runs the tests and fails below 80% lines, statements, functions or branches.
      - run: npm run coverage
      # Build needs the public Supabase values; placeholders are fine for type-checking and bundling.
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: placeholder
